<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PRO X | Ultimate Gaming Mouse</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ff;
            --neon-purple: #8b5cf6;
            --neon-blue: #3b82f6;
            --dark-bg: #030305;
            --dark-secondary: #0a0a12;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: #fff;
            overflow-x: hidden;
            cursor: default;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 9998;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .font-bebas {
            font-family: 'Bebas Neue', sans-serif;
        }

        /* Cinematic Letterboxing */
        .letterbox {
            position: fixed;
            left: 0;
            right: 0;
            height: 8vh;
            background: var(--dark-bg);
            z-index: 9000;
            pointer-events: none;
        }

        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        .letterbox.hidden {
            transform: scaleY(0);
            transition: transform 0.5s ease;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s ease, border-color 0.3s ease;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--neon-magenta);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10001;
        }

        .cursor.hovering {
            transform: scale(2);
            border-color: var(--neon-magenta);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 1rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glitch 2s infinite;
        }

        .loader-bar {
            width: 300px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .loader-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            animation: loading 2s ease forwards;
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-5px, 2px); }
            94% { transform: translate(5px, -2px); }
            96% { transform: translate(-3px, 1px); }
            98% { transform: translate(3px, -1px); }
        }

        /* Cinematic Background */
        .cinematic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 50%, rgba(0, 245, 255, 0.05) 0%, transparent 50%);
        }

        .parallax-stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 245, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.02) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
        }

        /* Aurora Effect */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .aurora-wave {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(0, 245, 255, 0.03) 60deg,
                transparent 120deg,
                rgba(255, 0, 255, 0.03) 180deg,
                transparent 240deg,
                rgba(139, 92, 246, 0.03) 300deg,
                transparent 360deg
            );
            animation: aurora 20s linear infinite;
        }

        @keyframes aurora {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar.scrolled {
            padding: 1rem 4rem;
            background: rgba(3, 3, 5, 0.9);
            backdrop-filter: blur(20px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.3rem;
            position: relative;
        }

        .logo span {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .logo:hover::after {
            transform: scaleX(1);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s ease;
            padding: 0.5rem 0;
        }

        .nav-links a::before,
        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--neon-cyan);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .nav-links a::before { top: 0; }
        .nav-links a::after { bottom: 0; }

        .nav-links a:hover {
            color: var(--neon-cyan);
        }

        .nav-links a:hover::before,
        .nav-links a:hover::after {
            transform: scaleX(1);
        }

        .navbar-cta {
            padding: 0.8rem 2rem;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .navbar-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }

        .navbar-cta:hover {
            color: var(--dark-bg);
            border-color: transparent;
        }

        .navbar-cta:hover::before {
            transform: translateX(0);
        }

        .navbar-cta span {
            position: relative;
            z-index: 1;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            overflow: hidden;
        }

        .hero-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            max-width: 1800px;
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            position: relative;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.5rem;
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 50px;
            margin-bottom: 2rem;
            width: fit-content;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.5s forwards;
        }

        .hero-badge-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 245, 255, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(0, 245, 255, 0); }
        }

        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 400;
            line-height: 0.85;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.7s forwards;
        }

        .hero-title .outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
            color: transparent;
        }

        .hero-title .gradient {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        .hero-title .gradient::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.6);
            max-width: 500px;
            line-height: 1.8;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.9s forwards;
        }

        .hero-stats {
            display: flex;
            gap: 4rem;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1.1s forwards;
        }

        .hero-stat {
            text-align: left;
        }

        .hero-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .hero-stat-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            margin-top: 0.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1.3s forwards;
        }

        .btn-magnetic {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem 3rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            border: none;
            color: var(--dark-bg);
            border-radius: 5px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.6s ease;
        }

        .btn-primary:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 5px;
        }

        .btn-secondary:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
        }

        .hero-right {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
        }

        .hero-mouse-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-mouse {
            position: relative;
            width: 600px;
            height: 600px;
            animation: float 8s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .hero-mouse img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 100px rgba(0, 245, 255, 0.5));
            transition: transform 0.5s ease;
        }

        .hero-mouse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0, 245, 255, 0.2);
            animation: ringPulse 4s ease-in-out infinite;
        }

        .hero-mouse-ring:nth-child(1) {
            width: 400px;
            height: 400px;
            animation-delay: 0s;
        }

        .hero-mouse-ring:nth-child(2) {
            width: 500px;
            height: 500px;
            animation-delay: 0.5s;
        }

        .hero-mouse-ring:nth-child(3) {
            width: 600px;
            height: 600px;
            animation-delay: 1s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.2; }
        }

        .hero-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.2) 0%, transparent 70%);
            filter: blur(50px);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
        }

        .hero-particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .hero-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: particleFloat 10s infinite;
        }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-200px) translateX(50px);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            25% { transform: translateY(-20px) rotateY(5deg); }
            50% { transform: translateY(0) rotateY(0deg); }
            75% { transform: translateY(-10px) rotateY(-5deg); }
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            z-index: 10;
        }

        .scroll-indicator-text {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            writing-mode: vertical-rl;
        }

        .scroll-line {
            width: 1px;
            height: 80px;
            background: linear-gradient(to bottom, var(--neon-cyan), transparent);
            position: relative;
            overflow: hidden;
        }

        .scroll-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(to bottom, transparent, var(--neon-cyan));
            animation: scrollLine 2s infinite;
        }

        @keyframes scrollLine {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(300%); }
        }

        /* Full Screen Sections */
        .full-section {
            min-height: 100vh;
            padding: 8vh 4rem;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Features Section */
        .features {
            background: linear-gradient(180deg, transparent, rgba(0, 245, 255, 0.02), transparent);
        }

        .features-container {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .section-header {
            margin-bottom: 5rem;
        }

        .section-overline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.3rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .section-overline.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease 0.1s;
        }

        .section-title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title span {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .features-showcase {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .feature-showcase-item {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(100px);
        }

        .feature-showcase-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .feature-showcase-item:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 245, 255, 0.3);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
        }

        .feature-showcase-image {
            position: relative;
            height: 300px;
            overflow: hidden;
        }

        .feature-showcase-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .feature-showcase-item:hover .feature-showcase-image img {
            transform: scale(1.1);
        }

        .feature-showcase-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
        }

        .feature-showcase-content {
            padding: 2rem;
            position: relative;
        }

        .feature-showcase-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.3;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .feature-showcase-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--neon-cyan);
        }

        .feature-showcase-desc {
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
            font-size: 1rem;
        }

        /* Specs Section */
        .specs {
            background: linear-gradient(180deg, transparent, rgba(255, 0, 255, 0.02), transparent);

        .specs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;

            margin: 0 auto;
            align-items: center;

        .specs-visual {
            position: relative;
            opacity: 0;
            transform: translateX(-100px);
            transition: all 1s ease;

        .specs-visual.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .specs-mouse-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

        .specs-mouse-wrapper img {

        .specs-radar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
        }

        .radar-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 0, 255, 0.1);
            border-radius: 50%;

        .radar-circle:nth-child(2) { width: 75%; height: 75%; }
        .radar-circle:nth-child(3) { width: 50%; height: 50%; }
        .radar-circle:nth-child(4) { width: 25%; height: 25%; }

        .radar-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 0, 255, 0.5), transparent);
            transform-origin: left center;
            animation: radarScan 4s linear infinite;
        }

        @keyframes radarScan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }

        .specs-content {
            opacity: 0;
            transform: translateX(100px);
            transition: all 1s ease 0.2s;
        }

        .specs-content.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;

        .spec-item {

            position: relative;
            overflow: hidden;

        .spec-item::before {
            content: '';

            top: 0;
            left: 0;

            height: 100%;

        .spec-icon {

        .spec-value {

            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            margin-top: 0.5rem;

        /* Immersive Gallery */
        .gallery {

        .gallery-container {

        .gallery-item {

        .gallery-number {

        /* Testimonials */
        .testimonials {

        .testimonial-quote {

        /* Footer */
        .footer {

        .footer-social {

        .footer-social a {

        .scroll-progress {

        /* Cinematic Mode Toggle */
        .cinematic-toggle {

            gap: 1rem;

            background: rgba(0, 0, 0, 0.8);

            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cinematic-toggle:hover {
            border-color: var(--neon-cyan);
        }

        .cinematic-toggle-label {

            font-size: 0.7rem;
            letter-spacing: 0.1rem;

        }

        .cinematic-toggle-switch {
            width: 50px;

            background: rgba(255, 255, 255, 0.1);

            transition: background 0.3s ease;
        }

        .cinematic-toggle.active .cinematic-toggle-switch {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));

        .cinematic-toggle-dot {
            position: absolute;
            top: 3px;
            left: 3px;

        .cinematic-toggle.active .cinematic-toggle-dot {

        /* Responsive */
        @media (max-width: 1200px) {

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Cursor
        const CustomCursor = () => {
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [hovering, setHovering] = useState(false);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    setPosition({ x: e.clientX, y: e.clientY });
                };

                const handleMouseOver = (e) => {
                    if (e.target.closest('a, button, .cursor-hover')) {
                        setHovering(true);
                    } else {
                        setHovering(false);
                    }
                };

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseover', handleMouseOver);

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseover', handleMouseOver);
                };
            }, []);

            return (
                <>
                    <div
                        className={`cursor ${hovering ? 'hovering' : ''}`}
                        style={{ left: position.x - 10, top: position.y - 10 }}
                    />
                    <div
                        className="cursor-dot"
                        style={{ left: position.x - 3, top: position.y - 3 }}
                    />
                </>
            );
        };

        // Cinematic Toggle
        const CinematicToggle = ({ active, onToggle }) => (
            <div className={`cinematic-toggle ${active ? 'active' : ''}`} onClick={onToggle}>
                <span className="cinematic-toggle-label">CINEMATIC</span>
                <div className="cinematic-toggle-switch">
                    <div className="cinematic-toggle-dot" />
                </div>
            </div>
        );

        // Stars Background
        const Stars = () => {
            const stars = Array.from({ length: 200 }, () => ({
                id: Math.random(),
                left: Math.random() * 100,
                top: Math.random() * 100,
                size: Math.random() * 2 + 1,
                delay: Math.random() * 3
            }));

            return (
                <div className="parallax-stars">
                    {stars.map(star => (
                        <div
                            key={star.id}
                            className="star"
                            style={{
                                left: `${star.left}%`,
                                top: `${star.top}%`,
                                width: `${star.size}px`,
                                height: `${star.size}px`,
                                animationDelay: `${star.delay}s`
                            }}
                        />
                    ))}
                </div>
            );
        };

        // Loading Screen
        const LoadingScreen = ({ loading }) => (
            <div className={`loading-screen ${loading ? '' : 'hidden'}`}>
                <div className="loader-text">NEXUS</div>
                <div className="loader-bar">
                    <div className="loader-progress" />
                </div>
            </div>
        );

        // Navbar
        const Navbar = ({ cinematicMode }) => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 100);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`navbar ${scrolled ? 'scrolled' : ''}`}>
                    <div className="logo"><span>NEXUS</span></div>
                    <ul className="nav-links">
                        <li><a href="#features">Features</a></li>
                        <li><a href="#specs">Specs</a></li>
                        <li><a href="#gallery">Gallery</a></li>
                        <li><a href="#reviews">Reviews</a></li>
                    </ul>
                    <button className="navbar-cta" onClick={() => document.getElementById('buy').scrollIntoView({ behavior: 'smooth' })}>
                        <span>PRE-ORDER</span>
                    </button>
                </nav>
            );
        };

        // Hero Section
        const Hero = () => {
            const particles = Array.from({ length: 30 }, (_, i) => ({
                id: i,
                left: Math.random() * 100,
                top: Math.random() * 100,
                delay: Math.random() * 10
            }));

            return (
                <section className="hero">
                    <div className="hero-container">
                        <div className="hero-left">
                            <div className="hero-badge">
                                <div className="hero-badge-dot" />
                                <span style={{ fontSize: '0.8rem', letterSpacing: '0.1rem', textTransform: 'uppercase' }}>
                                    New Release 2024
                                </span>
                            </div>
                            <h1 className="hero-title">
                                DOMINATE<br />
                                <span className="outline">THE</span><br />
                                <span className="gradient">GAME</span>
                            </h1>
                            <p className="hero-subtitle">
                                Experience precision like never before. The NEXUS PRO X delivers
                                lightning-fast response times, customizable RGB lighting, and
                                ergonomic design built for champions.
                            </p>
                            <div className="hero-stats">
                                <div className="hero-stat">
                                    <div className="hero-stat-value">25,600</div>
                                    <div className="hero-stat-label">Max DPI</div>
                                </div>
                                <div className="hero-stat">
                                    <div className="hero-stat-value">0.2ms</div>
                                    <div className="hero-stat-label">Response</div>
                                </div>
                                <div className="hero-stat">
                                    <div className="hero-stat-value">200hr</div>
                                    <div className="hero-stat-label">Battery</div>
                                </div>
                            </div>
                            <div className="hero-buttons">
                                <button
                                    className="btn-magnetic btn-primary"
                                    onClick={() => document.getElementById('buy').scrollIntoView({ behavior: 'smooth' })}
                                >
                                    Get Yours Now
                                </button>
                                <button
                                    className="btn-magnetic btn-secondary"
                                    onClick={() => document.getElementById('specs').scrollIntoView({ behavior: 'smooth' })}
                                >
                                    Explore Specs
                                </button>
                            </div>
                        </div>
                        <div className="hero-right">
                            <div className="hero-mouse-container">
                                <div className="hero-mouse">
                                    <div className="hero-mouse-ring"></div>
                                    <div className="hero-mouse-ring"></div>
                                    <div className="hero-mouse-ring"></div>
                                    <div className="hero-glow"></div>
                                    <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=800" alt="NEXUS PRO X" />
                                    <div className="hero-particles">
                                        {particles.map(p => (
                                            <div
                                                key={p.id}
                                                className="hero-particle"
                                                style={{
                                                    left: `${p.left}%`,
                                                    top: `${p.top}%`,
                                                    animationDelay: `${p.delay}s`
                                                }}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="scroll-indicator">
                        <div className="scroll-line"></div>
                        <span className="scroll-indicator-text">Scroll</span>
                    </div>
                </section>
            );
        };

        // Features Section
        const Features = () => {
            const sectionRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.2 }
                );

                if (sectionRef.current) {
                    observer.observe(sectionRef.current);
                }

                return () => observer.disconnect();
            }, []);

            const features = [
                {
                    number: '01',
                    title: 'Ultra-Precision Sensor',
                    desc: '25,600 DPI optical sensor with pixel-perfect tracking for the most demanding games.',
                    image: 'https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=800'
                },
                {
                    number: '02',
                    title: 'Wireless Freedom',
                    desc: '0.2ms response time with 2.4GHz wireless connection. Faster than most wired mice.',
                    image: 'https://images.unsplash.com/photo-1593305841991-05c29736f87e?w=800'
                },
                {
                    number: '03',
                    title: 'RGB Customization',
                    desc: '16.8 million colors with per-key lighting. Create your unique gaming aesthetic.',
                    image: 'https://images.unsplash.com/photo-1587829741301-dc798b91add1?w=800'
                }
            ];

            return (
                <section className="full-section features" id="features" ref={sectionRef}>
                    <div className="features-container">
                        <div className="section-header">
                            <div className={`section-overline ${isVisible ? 'visible' : ''}`}>Features</div>
                            <h2 className={`section-title ${isVisible ? 'visible' : ''}`}>
                                Engineered for <span>Excellence</span>
                            </h2>
                        </div>
                        <div className="features-showcase">
                            {features.map((feature, index) => (
                                <div
                                    key={index}
                                    className={`feature-showcase-item ${isVisible ? 'visible' : ''}`}
                                    style={{ transitionDelay: `${index * 0.15}s` }}
                                >
                                    <div className="feature-showcase-image">
                                        <img src={feature.image} alt={feature.title} />
                                        <div className="feature-showcase-overlay"></div>
                                    </div>
                                    <div className="feature-showcase-content">
                                        <div className="feature-showcase-number">{feature.number}</div>
                                        <h3 className="feature-showcase-title">{feature.title}</h3>
                                        <p className="feature-showcase-desc">{feature.desc}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Specs Section
        const Specs = () => {
            const sectionRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.2 }
                );

                if (sectionRef.current) {
                    observer.observe(sectionRef.current);
                }

                return () => observer.disconnect();
            }, []);

            const specs = [
                { icon: '⚡', value: '25,600', label: 'Max DPI' },
                { icon: '🎯', value: '1000Hz', label: 'Polling Rate' },
                { icon: '⏱️', value: '0.2ms', label: 'Response Time' },
                { icon: '🔋', value: '200hrs', label: 'Battery Life' }
            ];

            return (
                <section className="full-section specs" id="specs" ref={sectionRef}>
                    <div className="specs-container">
                        <div className={`specs-visual ${isVisible ? 'visible' : ''}`}>
                            <div className="specs-mouse-wrapper">
                                <div className="specs-radar">
                                    <div className="radar-circle"></div>
                                    <div className="radar-circle"></div>
                                    <div className="radar-circle"></div>
                                    <div className="radar-circle"></div>
                                    <div className="radar-line"></div>
                                </div>
                                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800" alt="NEXUS PRO X" />
                            </div>
                        </div>
                        <div className={`specs-content ${isVisible ? 'visible' : ''}`}>
                            <div className="section-overline">Technical</div>
                            <h2 className="section-title">
                                Precision <span>Specifications</span>
                            </h2>
                            <p style={{ color: 'rgba(255,255,255,0.6)', fontSize: '1.1rem', lineHeight: 1.8, marginTop: '1rem' }}>
                                Every component engineered for peak performance
                            </p>
                            <div className="specs-grid">
                                {specs.map((spec, index) => (
                                    <div key={index} className="spec-item">
                                        <div className="spec-icon">{spec.icon}</div>
                                        <div className="spec-value">{spec.value}</div>
                                        <div className="spec-label">{spec.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Gallery Section
        const Gallery = () => {
            const [activeIndex, setActiveIndex] = useState(0);
            const galleryRef = useRef(null);

            const galleryItems = [
                { number: '01', title: 'RGB Lighting System', desc: 'Immersive 16.8 million color RGB lighting with customizable zones', image: 'https://images.unsplash.com/photo-1612287230217-969b659c55c0?w=1600' },
                { number: '02', title: 'Ergonomic Design', desc: 'Crafted for comfort during extended gaming sessions', image: 'https://images.unsplash.com/photo-1493711662062-fa541f7f3d24?w=1600' },
                { number: '03', title: 'Pro Performance', desc: 'Built with professional esports athletes in mind', image: 'https://images.unsplash.com/photo-1542751110-97427bbecf20?w=1600' }
            ];

            useEffect(() => {
                const handleScroll = () => {
                    const section = galleryRef.current;
                    if (!section) return;

                    const rect = section.getBoundingClientRect();
                    const windowHeight = window.innerHeight;

                    galleryItems.forEach((_, index) => {
                        const itemTop = rect.top + index * windowHeight;
                        const progress = (windowHeight - itemTop) / windowHeight;
                        if (progress > 0 && progress < 1) {
                            setActiveIndex(index);
                        }
                    });
                };

                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <section className="gallery" id="gallery" ref={galleryRef}>
                    <div className="gallery-container">
                        {galleryItems.map((item, index) => (
                            <div key={index} className="gallery-item">
                                <img className="gallery-image" src={item.image} alt={item.title} />
                                <div className="gallery-overlay"></div>
                                <div className={`gallery-content ${activeIndex >= index ? 'visible' : ''}`}>
                                    <div className="gallery-number">{item.number}</div>
                                    <h3 className="gallery-title">{item.title}</h3>
                                    <p className="gallery-desc">{item.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        // Testimonials Section
        const Testimonials = () => {
            const sectionRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.2 }
                );

                if (sectionRef.current) {
                    observer.observe(sectionRef.current);
                }

                return () => observer.disconnect();
            }, []);

            const testimonials = [
                { text: 'The NEXUS PRO X completely transformed my competitive gaming experience. The precision is unmatched and the battery life is incredible.', name: 'Alex Chen', role: 'Pro Esports Player', initial: 'AC' },
                { text: 'Best gaming mouse I\'ve ever used. The RGB customization is stunning and the ergonomics are perfect for long streaming sessions.', name: 'Sarah Johnson', role: 'Content Creator', initial: 'SJ' },
                { text: 'From FPS to MOBA, this mouse excels in every genre. The programmable buttons are a game-changer for competitive play.', name: 'Mike Rodriguez', role: 'Twitch Streamer', initial: 'MR' },
                { text: 'Finally a mouse that delivers on all promises. The wireless performance is indistinguishable from wired - truly impressive.', name: 'Emma Wilson', role: 'Game Developer', initial: 'EW' }
            ];

            return (
                <section className="full-section testimonials" id="reviews" ref={sectionRef}>
                    <div className="testimonials-wrapper">
                        <div className="section-header">
                            <div className={`section-overline ${isVisible ? 'visible' : ''}`}>Testimonials</div>
                            <h2 className={`section-title ${isVisible ? 'visible' : ''}`}>
                                What <span>Players Say</span>
                            </h2>
                        </div>
                        <div className="testimonials-slider">
                            {testimonials.map((t, index) => (
                                <div
                                    key={index}
                                    className={`testimonial-card ${isVisible ? 'visible' : ''}`}
                                    style={{ transitionDelay: `${index * 0.1}s` }}
                                >
                                    <div className="testimonial-quote">"</div>
                                    <p className="testimonial-text">{t.text}</p>
                                    <div className="testimonial-author">
                                        <div className="testimonial-avatar">{t.initial}</div>
                                        <div className="testimonial-info">
                                            <h4>{t.name}</h4>
                                            <p>{t.role}</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // CTA Section
        const CTA = () => {
            const sectionRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.2 }
                );

                if (sectionRef.current) {
                    observer.observe(sectionRef.current);
                }

                return () => observer.disconnect();
            }, []);

            return (
                <section className="cta" id="buy" ref={sectionRef}>
                    <div className="cta-bg"></div>
                    <div className="cta-content">
                        <div className={`cta-badge ${isVisible ? 'visible' : ''}`}>
                            <span style={{ fontSize: '0.8rem', letterSpacing: '0.1rem', textTransform: 'uppercase' }}>
                                Limited Edition • Pre-Order Now
                            </span>
                        </div>
                        <h2 className={`cta-title ${isVisible ? 'visible' : ''}`}>
                            Ready to <span style={{ background: 'linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta))', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Dominate?</span>
                        </h2>
                        <div className={`cta-price ${isVisible ? 'visible' : ''}`}>
                            $149.99<span>USD</span>
                        </div>
                        <button className={`cta-btn ${isVisible ? 'visible' : ''}`}>
                            Order Now
                        </button>
                    </div>
                </section>
            );
        };

        // Footer
        const Footer = () => (
            <footer className="footer">
                <div className="footer-logo"><span>NEXUS</span></div>
                <div className="footer-links">
                    <a href="#">Products</a>
                    <a href="#">Support</a>
                    <a href="#">About</a>
                    <a href="#">Contact</a>
                </div>
                <div className="footer-social">
                    <a href="#">𝕏</a>
                    <a href="#">📷</a>
                    <a href="#">▶</a>
                    <a href="#">💬</a>
                </div>
            </footer>
        );

        // Scroll Progress
        const ScrollProgress = () => {
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scrolled = (winScroll / height) * 100;
                    setProgress(scrolled);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return <div className="scroll-progress" style={{ width: `${progress}%` }}></div>;
        };

        // Main App
        const App = () => {
            const [loading, setLoading] = useState(true);
            const [cinematicMode, setCinematicMode] = useState(false);

            useEffect(() => {
                setTimeout(() => setLoading(false), 2000);
            }, []);

            useEffect(() => {
                const letterboxes = document.querySelectorAll('.letterbox');
                letterboxes.forEach(lb => {
                    lb.classList.toggle('hidden', !cinematicMode);
                });
            }, [cinematicMode]);

            return (
                <>
                    <LoadingScreen loading={loading} />
                    <div className="cinematic-bg">
                        <div className="bg-gradient"></div>
                        <Stars />
                        <div className="grid-lines"></div>
                    </div>
                    <div className="aurora">
                        <div className="aurora-wave"></div>
                    </div>
                    <ScrollProgress />
                    <CustomCursor />
                    <Navbar cinematicMode={cinematicMode} />
                    <Hero />
                    <Features />
                    <Specs />
                    <Gallery />
                    <Testimonials />
                    <CTA />
                    <Footer />
                    <CinematicToggle active={cinematicMode} onToggle={() => setCinematicMode(!cinematicMode)} />
                    <div className="letterbox letterbox-top"></div>
                    <div className="letterbox letterbox-bottom"></div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
